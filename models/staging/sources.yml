version: 2

sources:
  - name: raw
    schema: raw
    description: "Raw ingestion layer from Lending Club, FRED, and SEC EDGAR"
    tables:
      - name: lc_loans
        description: "2.9M Lending Club loan records from Kaggle (2007–2018 Q4)"
        columns:
          - name: loan_id
            description: "Lending Club loan identifier (primary key)"
            tests: [not_null, unique]
          - name: loan_amnt
            tests: [not_null]
          - name: issue_date
            tests: [not_null]
          - name: loan_status
            tests: [not_null]

      - name: fred_indicators
        description: "Macro time-series from FRED API (FEDFUNDS, UNRATE, CPIAUCSL, GDPC1)"
        columns:
          - name: series_id
            tests: [not_null]
          - name: observation_date
            tests: [not_null]
          - name: value
            tests: [not_null]

      - name: sec_financials
        description: "SEC EDGAR XBRL financial statements via frames API"
        columns:
          - name: adsh
            tests: [not_null]
          - name: tag
            tests: [not_null]
          - name: period
            tests: [not_null]
