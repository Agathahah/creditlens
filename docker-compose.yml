version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: creditlens-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: creditlens
      POSTGRES_USER: creditlens
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-devpassword}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init_db.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U creditlens"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: creditlens-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 3

  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.15.0
    container_name: creditlens-mlflow
    ports:
      - "5000:5000"
    command: mlflow server --host 0.0.0.0 --port 5000 --backend-store-uri sqlite:///mlflow.db
    volumes:
      - mlflow_data:/mlflow

  grafana:
    image: grafana/grafana:latest
    container_name: creditlens-grafana
    ports:
      - "3001:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./infra/grafana/provisioning:/etc/grafana/provisioning
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"

  api:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.api
    container_name: creditlens-api
    ports:
      - "8000:8000"
    environment:
      - POSTGRES_URL=postgresql://creditlens:${POSTGRES_PASSWORD:-devpassword}@postgres:5432/creditlens
      - REDIS_URL=redis://redis:6379
      - MLFLOW_URL=http://mlflow:5000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./src:/app/src

volumes:
  postgres_data:
  mlflow_data:
  grafana_data:
