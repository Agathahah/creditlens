apiVersion: 1

# CreditLens warehouse datasource for Grafana monitoring dashboards.
datasources:
  - name: CreditLens PostgreSQL
    type: postgres
    access: proxy
    url: postgres:5432
    database: creditlens
    user: creditlens
    secureJsonData:
      password: ${POSTGRES_PASSWORD:-devpassword}
    jsonData:
      sslmode: disable
      postgresVersion: 1600
    isDefault: true
    editable: true
