[project]
name = "creditlens"
version = "0.1.0"
description = "Production-grade explainable credit scoring engine for fintech lending"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [
    {name = "Agatha Silalahi", email = "silalahiagatha15@gmail.com"}
]
keywords = ["credit-scoring", "machine-learning", "fintech", "explainability", "xgboost"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.30.0",
    "psycopg2-binary>=2.9.0",
    "alembic>=1.13.0",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "scikit-learn>=1.5.0",
    "xgboost>=2.1.0",
    "lightgbm>=4.4.0",
    "shap>=0.46.0",
    "optuna>=3.6.0",
    "feast>=0.40.0",
    "mlflow>=2.15.0",
    "evidently>=0.4.0",
    "fredapi>=0.5.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "structlog>=24.4.0",
    "redis>=5.0.0",
    "dbt-postgres>=1.8.0",
    "dice-ml>=0.10.0",
    "aif360>=0.6.0",
    "streamlit>=1.38.0",
    "tqdm>=4.66.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-cov>=5.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-mock>=3.14.0",
    "black>=24.8.0",
    "isort>=5.13.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
    "pre-commit>=3.8.0",
    "httpx>=0.27.0",
    "faker>=28.0.0",
]
bonus = [
    "markitdown[all]>=0.1.6",
]

[project.urls]
Homepage = "https://github.com/YOUR_USERNAME/creditlens"
Repository = "https://github.com/YOUR_USERNAME/creditlens"
Issues = "https://github.com/YOUR_USERNAME/creditlens/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.isort]
profile = "black"
line_length = 100

[tool.ruff]
line-length = 100
target-version = "py312"
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
testpaths = ["src", "tests"]
asyncio_mode = "auto"
addopts = "-v --tb=short"

[tool.hatch.build.targets.wheel]
packages = ["src"]
